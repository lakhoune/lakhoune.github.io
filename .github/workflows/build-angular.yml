name: Build static files for website

on:
  push:
    branches:
      - master
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
    - name: Install
      run: npm ci
    - name: Install Chrome for CI
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: latest
    - name: Set CHROME_BIN from installed Chrome
      run: |
        CHROME_BIN=$(find /opt/hostedtoolcache/setup-chrome -type f -name chrome | head -n 1)
        if [ -z "$CHROME_BIN" ]; then
          CHROME_BIN=$(command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
        fi
        if [ -z "$CHROME_BIN" ]; then
          echo "No Chrome binary found"
          exit 1
        fi
        echo "CHROME_BIN=$CHROME_BIN" >> $GITHUB_ENV
    - name: Verify Chrome binary
      run: |
        echo "CHROME_BIN=$CHROME_BIN"
        "$CHROME_BIN" --version
        ldd "$CHROME_BIN" | grep -i 'not found' || true
    - name: Run tests
      run: npx ng test --watch=false --no-progress
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Cancel Previous Runs
      uses: styfle/cancel-workflow-action@0.9.1
      with:
        access_token: ${{ github.token }}
    - uses: actions/checkout@v2
      with:
        persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal access token.
        fetch-depth: 0 # otherwise, there would be errors pushing refs to the destination repository.
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
    - name: Build the app
      run: npm ci && npm run build
    - name: Move built site to docs root
      run: |
        if [ -d docs/browser ]; then
          cp -R docs/browser/* docs/
          rm -rf docs/browser
        fi
    - name: Move CNAME file to docs
      run: cp CNAME ./docs
    - name: Move 404.html file to docs
      run: cp 404.html ./docs
    - name: Commit files
      run: |
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git pull origin master
        git add docs
        git commit -m "build docs" -a
    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}
